<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0000aa">
<title>Livro do projeto</title>
<!--
  Modelo do livro: o tools/livro.zig (`zig build site`) troca o marcador LIVRO pelos .md do repositório e grava livro.html. O Markdown é
  desenhado aqui pelo marked, as equações pelo KaTeX e os diagramas pelo mermaid (versões fixas, do jsDelivr).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
  :root {
    --azul: #0000aa; --fundo: #f4f4f7; --cartao: #ffffff; --texto: #1d1d26; --apagado: #6a6a7a; --linha: #d9d9e3;
    --mono: ui-monospace, "DejaVu Sans Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--azul); color: #fff; padding: 12px 16px 0; position: sticky; top: 0; z-index: 5; }
  header h1 { font: 18px var(--mono); margin: 0 0 8px; display: flex; gap: 12px; align-items: center; }
  header a { color: #fff; }
  #menu { all: unset; display: none; cursor: pointer; font: 20px var(--mono); }
  nav { display: flex; gap: 2px; }
  nav a { padding: 6px 12px; font: 14px var(--mono); color: #c0c0c0; text-decoration: none; }
  nav a.ativo { background: var(--fundo); color: var(--azul); }
  .corpo { display: grid; grid-template-columns: 300px minmax(0, 1fr); max-width: 1400px; margin: 0 auto; }
  aside { position: sticky; top: 84px; height: calc(100vh - 84px); overflow-y: auto; padding: 12px 8px 24px 16px; border-right: 1px solid var(--linha); }
  aside input { width: 100%; padding: 6px 10px; border: 1px solid var(--linha); border-radius: 6px; font: inherit; font-size: 14px; margin-bottom: 8px; }
  aside h2 { font: 13px var(--mono); color: var(--azul); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  aside a { display: block; padding: 3px 8px; border-radius: 5px; color: var(--texto); text-decoration: none; font-size: 14px; line-height: 1.35; }
  aside a small { display: block; color: var(--apagado); font: 11px var(--mono); }
  aside a:hover { background: #e9e9f0; }
  aside a.ativo { background: var(--azul); color: #fff; }
  aside a.ativo small { color: #c8c8ff; }
  main { padding: 16px 32px 48px; min-width: 0; }
  article { background: var(--cartao); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 32px 24px; max-width: 980px; }
  article h1 { font-size: 28px; line-height: 1.25; }
  article h2 { border-bottom: 1px solid var(--linha); padding-bottom: 4px; margin-top: 32px; }
  article img { max-width: 100%; border: 1px solid var(--linha); border-radius: 6px; }
  article pre { background: #f0f0f6; border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 13px; }
  article code { font: 0.9em var(--mono); background: #ececf3; padding: 0 4px; border-radius: 3px; }
  article pre code { background: none; padding: 0; }
  article pre.mermaid { text-align: center; background: #f7f7fb; cursor: zoom-in; position: relative; }
  article pre.mermaid[data-processed]::after { content: "clique para ampliar"; position: absolute; right: 10px; bottom: 6px;
    font: 11px var(--mono); color: #8a8aa0; }
  #zoom { display: none; position: fixed; inset: 0; z-index: 50; background: #fff; overflow: auto; padding: 24px;
    cursor: zoom-out; }
  #zoom.aberto { display: block; }
  article table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: 12px 0; }
  article th, article td { border: 1px solid var(--linha); padding: 4px 8px; text-align: left; vertical-align: top; }
  article th { background: #f0f0f6; }
  article blockquote { margin: 0; padding: 4px 16px; border-left: 4px solid var(--linha); color: var(--apagado); }
  .equacao { overflow-x: auto; padding: 4px 0; }
  .passos { display: flex; justify-content: space-between; gap: 12px; max-width: 980px; margin-top: 16px; }
  .passos a { flex: 1; background: var(--cartao); border: 1px solid var(--linha); border-radius: 8px; padding: 10px 14px; text-decoration: none; color: var(--texto); }
  .passos a small { display: block; color: var(--apagado); font-size: 12px; }
  .passos a.prox { text-align: right; }
  .resultado { font-size: 12px; color: var(--apagado); padding: 0 8px; }
  @media (max-width: 860px) {
    .corpo { grid-template-columns: 1fr; }
    #menu { display: inline; }
    aside { display: none; position: fixed; inset: 84px 0 0 0; background: var(--fundo); z-index: 4; height: auto; }
    aside.aberto { display: block; }
    main { padding: 10px; }
    article { padding: 4px 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1><button id="menu" aria-label="capítulos">☰</button>AircraftSimulation</h1>
  <nav><a href="livro.html" class="ativo">Livro</a><a href="mapa.html">Mapa</a><a href="tracking.html">Tracking</a><a href="index.html">Programas</a></nav>
</header>
<div class="corpo">
  <aside id="lado"><input id="busca" placeholder="buscar no livro"><div id="sumario"></div></aside>
  <main><article id="pagina"></article><div class="passos" id="passos"></div></main>
</div>
<script>
const LIVRO = /*LIVRO*/null;
const PAGINAS = LIVRO.grupos.flatMap(g => g.paginas.map(p => ({ ...p, grupo: g.nome })));
const POR_CAMINHO = Object.fromEntries(PAGINAS.map(p => [p.caminho, p]));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

// um diagrama largo fica pequeno na página: clicar abre ele no tamanho natural, com rolagem; Esc ou clique fecha
const zoom = document.createElement('div');
zoom.id = 'zoom';
document.body.appendChild(zoom);
zoom.addEventListener('click', () => { zoom.classList.remove('aberto'); zoom.innerHTML = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') zoom.click(); });
document.addEventListener('click', e => {
  const diagrama = e.target.closest('article pre.mermaid');
  const svg = diagrama && diagrama.querySelector('svg');
  if (!svg) return;
  const copia = svg.cloneNode(true);
  const caixa = svg.viewBox.baseVal;
  copia.style.maxWidth = 'none';
  copia.setAttribute('width', caixa.width);
  copia.setAttribute('height', caixa.height);
  zoom.innerHTML = '';
  zoom.appendChild(copia);
  zoom.classList.add('aberto');
});

// ---------- Markdown com equações e diagramas ----------
// O marked não conhece LaTeX: as equações (```math, $$...$$, $`...`$ e $...$) e os diagramas (```mermaid) saem do texto antes,
// trocados por marcas, e voltam desenhados depois. O código (``` e `...`) fica como está.
function desenhaMd(texto) {
  const guardados = [];
  const guarda = html => `\u0000${guardados.push(html) - 1}\u0000`;
  const tex = (expr, bloco) => {
    try { return window.katex ? katex.renderToString(expr, { displayMode: bloco, throwOnError: false }) : esc(expr); }
    catch (e) { return esc(expr); }
  };
  const partes = texto.split(/(^```[^\n]*\n[\s\S]*?^```[ \t]*$)/m);
  const saida = partes.map(parte => {
    const cerca = parte.match(/^```([^\n]*)\n([\s\S]*?)```[ \t]*$/);
    if (cerca) {
      const lingua = cerca[1].trim();
      if (lingua === 'math') return '\n' + guarda(`<div class="equacao">${tex(cerca[2], true)}</div>`) + '\n';
      if (lingua === 'mermaid') return '\n' + guarda(`<pre class="mermaid">${esc(cerca[2])}</pre>`) + '\n';
      return parte;
    }
    // fora das cercas: protege o código em linha e tira as equações
    const codigos = [];
    return parte
      .replace(/\$`([^`\n]+)`\$/g, (_, e) => guarda(tex(e, false)))           // $`...`$ (o jeito do GitHub)
      .replace(/`[^`\n]+`/g, c => `\u0001${codigos.push(c) - 1}\u0001`)
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, e) => guarda(`<div class="equacao">${tex(e, true)}</div>`))
      .replace(/(^|[^\\\w$])\$(?=\S)([^$\n]+?)(?<=\S)\$(?![\w$])/g, (_, antes, e) => antes + guarda(tex(e, false)))
      .replace(/\u0001(\d+)\u0001/g, (_, i) => codigos[i]);
  }).join('');
  let html = marked.parse(saida, { gfm: true });
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => guardados[i]);
}

const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
function resolve(base, alvo) {
  const partes = base.split('/').slice(0, -1);
  for (const p of alvo.split('/')) { if (p === '..') partes.pop(); else if (p && p !== '.') partes.push(p); }
  return partes.join('/');
}

// ---------- página ----------
function abre(caminho, ancora) {
  const pagina = POR_CAMINHO[caminho] || PAGINAS[0];
  const artigo = document.getElementById('pagina');
  artigo.innerHTML = desenhaMd(pagina.md);
  // ids nos títulos (para os links #seção) e os links e imagens relativos ao .md
  artigo.querySelectorAll('h1, h2, h3, h4').forEach(h => { h.id = slug(h.textContent); });
  artigo.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src');
    if (src && !/^[a-z]+:/.test(src)) img.src = 'livro/' + resolve(pagina.caminho, src);
    img.loading = 'lazy';
  });
  artigo.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^[a-z]+:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (href.startsWith('#')) { a.href = '#' + pagina.caminho + href; return; }
    const [arquivo, secao] = href.split('#');
    const destino = resolve(pagina.caminho, arquivo);
    if (destino.endsWith('/') || POR_CAMINHO[destino + '/README.md']) { const r = destino.replace(/\/$/, '') + '/README.md'; if (POR_CAMINHO[r]) { a.href = '#' + r; return; } }
    if (POR_CAMINHO[destino]) a.href = '#' + destino + (secao ? '#' + secao : '');
    else { a.href = LIVRO.github + destino + (secao ? '#' + secao : ''); a.target = '_blank'; a.rel = 'noopener'; }
  });
  if (window.mermaid) mermaid.run({ nodes: artigo.querySelectorAll('pre.mermaid') }).catch(() => {});
  // anterior e próxima
  const i = PAGINAS.indexOf(pagina);
  const ant = PAGINAS[i - 1], prox = PAGINAS[i + 1];
  document.getElementById('passos').innerHTML =
    (ant ? `<a href="#${ant.caminho}"><small>← anterior</small>${esc(ant.titulo)}</a>` : '<span></span>') +
    (prox ? `<a class="prox" href="#${prox.caminho}"><small>próxima →</small>${esc(prox.titulo)}</a>` : '<span></span>');
  document.querySelectorAll('#sumario a').forEach(a => a.classList.toggle('ativo', a.dataset.caminho === pagina.caminho));
  document.title = pagina.titulo + ' — Livro do projeto';
  document.getElementById('lado').classList.remove('aberto');
  const alvo = ancora && document.getElementById(ancora);
  if (alvo) alvo.scrollIntoView(); else window.scrollTo(0, 0);
}

// ---------- sumário e busca ----------
function sumario(busca) {
  const q = busca.trim().toLowerCase();
  let html = '';
  for (const g of LIVRO.grupos) {
    const paginas = g.paginas.filter(p => !q || p.titulo.toLowerCase().includes(q) || p.caminho.toLowerCase().includes(q) || p.md.toLowerCase().includes(q));
    if (!paginas.length) continue;
    html += `<h2>${esc(g.nome)}</h2>` + paginas.map(p => {
      const vezes = q ? p.md.toLowerCase().split(q).length - 1 : 0;
      return `<a href="#${p.caminho}" data-caminho="${p.caminho}">${esc(p.titulo)}${vezes ? `<small>${vezes}×</small>` : ''}</a>`;
    }).join('');
  }
  document.getElementById('sumario').innerHTML = html || '<p class="resultado">nada encontrado</p>';
  const atual = decodeURIComponent(location.hash.slice(1)).split('#')[0];
  document.querySelectorAll('#sumario a').forEach(a => a.classList.toggle('ativo', a.dataset.caminho === atual));
}
document.getElementById('busca').addEventListener('input', e => sumario(e.target.value));
document.getElementById('menu').addEventListener('click', () => document.getElementById('lado').classList.toggle('aberto'));

function rota() {
  const [caminho, ancora] = decodeURIComponent(location.hash.slice(1)).split('#');
  abre(caminho || PAGINAS[0].caminho, ancora);
}
window.addEventListener('hashchange', rota);
sumario('');
rota();
</script>
</body>
</html>
