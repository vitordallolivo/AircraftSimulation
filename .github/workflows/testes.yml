# Roda os checks de tools/checks (os mesmos do `python tools/checks/run.py --tudo`) a cada PR para a main e a cada
# push na 0.2_dev. Três jobs em paralelo, um por parte; cada um sobe o relatório em Markdown como artefato
# (aba Actions -> a rodada -> Artifacts). No PC, o mesmo:
#   python tools/checks/run.py --tudo --relatorio relatorio.md
name: testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [0.2_dev]
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read

# um push novo na mesma branch cancela a rodada anterior, que já ficou velha
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # uma parte quebrada não esconde o resultado das outras
      matrix:
        include:
          - nome: núcleo e AeroDrive
            grupos: fundação,aerodrive
            arquivo: nucleo-aerodrive
          - nome: regressão bit a bit
            grupos: regressão
            arquivo: regressao
          - nome: testes Python
            grupos: testes
            arquivo: testes-python
    steps:
      # o histórico inteiro: a regressão compara com a origin/main numa cópia separada (git worktree)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # bibliotecas do sistema: raylib nativo (AeroDrive) e Qt/OpenGL sem tela (GUI, pyqtgraph)
      - name: Bibliotecas do sistema
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxext-dev
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0

      - name: Dependências do Python
        run: pip install -r requirements.txt -r requirements-aero.txt pytest

      # pacotes do Zig (raylib) e o cache de compilação entre uma rodada e outra
      - uses: actions/cache@v4
        with:
          path: |
            aerodrive/zig-pkg
            ~/.cache/zig
          key: zig-testes-${{ runner.os }}-${{ hashFiles('aerodrive/build.zig.zon') }}

      # retratos da regressão, um por commit (~/.cache/aerosim-checks): o da main só se calcula uma vez
      - if: matrix.grupos == 'regressão'
        uses: actions/cache@v4
        with:
          path: ~/.cache/aerosim-checks/*.pkl
          key: retratos-${{ github.sha }}
          restore-keys: retratos-

      - name: Checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/checks/run.py --tudo --grupos "${{ matrix.grupos }}" --relatorio relatorio.md

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.arquivo }}
          path: relatorio.md
          if-no-files-found: ignore
