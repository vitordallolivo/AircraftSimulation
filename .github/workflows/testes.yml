# Roda os checks (os mesmos do `zig build check -- --tudo`, tools/check.zig) a cada PR para a main (uma rodada
# por push no PR; o push na 0.2_dev sozinho não dispara, para não rodar duas vezes o mesmo commit). Dois jobs em
# paralelo, um por parte; cada um sobe o relatório em Markdown como artefato (aba Actions -> a rodada -> Artifacts). No PC, o mesmo:
#   python -m ziglang build check -- --tudo --relatorio relatorio.md
name: testes

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read

# um push novo na mesma branch cancela a rodada anterior, que já ficou velha
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # uma parte quebrada não esconde o resultado das outras
      matrix:
        include:
          - nome: núcleo e AeroDrive
            grupos: fundação,aerodrive
            arquivo: nucleo-aerodrive
          - nome: regressão bit a bit
            grupos: regressão
            arquivo: regressao
    steps:
      # o histórico inteiro: a regressão compara com a origin/main numa cópia separada (git worktree)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bibliotecas do sistema: raylib nativo (AeroDrive e a tela do aerosim)
      - name: Bibliotecas do sistema
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxext-dev

      - name: Zig 0.16.0
        run: pip install "ziglang==0.16.0"

      # pacotes do Zig (raylib) e o cache de compilação entre uma rodada e outra
      - uses: actions/cache@v4
        with:
          path: |
            aerodrive/zig-pkg
            aerosim/zig-pkg
            ~/.cache/zig
          key: zig-testes-${{ runner.os }}-${{ hashFiles('aerodrive/build.zig.zon', 'aerosim/build.zig.zon') }}

      # retratos da regressão, um por commit (~/.cache/aerosim-checks): o da main só se calcula uma vez
      - if: matrix.grupos == 'regressão'
        uses: actions/cache@v4
        with:
          path: ~/.cache/aerosim-checks/*.txt
          key: retratos-${{ github.sha }}
          restore-keys: retratos-

      - name: Checks
        run: python -m ziglang build check -- --tudo --grupos "${{ matrix.grupos }}" --relatorio "$PWD/relatorio.md"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.arquivo }}
          path: relatorio.md
          if-no-files-found: ignore

  # o livro (todos os .md) e a página do tracking como artefato, para ver antes do merge; são os mesmos que o site.yml publica
  tracking:
    name: livro e tracking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zig 0.16.0
        run: pip install "ziglang==0.16.0"
      - name: Gerar a página
        run: python -m ziglang build tracking -- --check && python -m ziglang build site -- --saida livro
      - uses: actions/upload-artifact@v4
        with:
          name: livro
          path: livro
